<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>StateDock · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);display:grid;place-items:center;background:#090d16;color:#f8fafc;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #1e293b;border-radius:20px;background:#0f172a;text-align:center;box-shadow:0 18px 55px #00000050}.mark{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:#2563eb;display:grid;place-items:center;color:#fff;font-size:28px}.card h1{font-size:22px;margin:0 0 8px}.card p{margin:0;color:#94a3b8;font-size:14px}.card button{margin-top:24px;border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 18px;font-size:14px;font-weight:600}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">⌁</div>
      <h1 id="title">Temporarily Offline</h1>
      <p id="desc">StateDock needs an internet connection to sync latest project states. Please reconnect to continue.</p>
      <button id="btn" onclick="location.reload()">Reconnect</button>
    </main>
    <script>
      try {
        var isZh = (localStorage.getItem("statedock_lang") || navigator.language || "").toLowerCase().indexOf("zh") === 0;
        if (isZh) {
          document.documentElement.lang = "zh-CN";
          document.title = "StateDock · 离线";
          document.getElementById("title").textContent = "暂时无法连接";
          document.getElementById("desc").textContent = "StateDock 需要联网读取最新项目状态。恢复网络后请重试；离线期间的修改不会保存在这台设备上。";
          document.getElementById("btn").textContent = "重新连接";
        }
      } catch(e) {}
    </script>
  </body>
</html>
